name: Build & Push Laravel CI images

on:
  push:
    branches: [main]
    paths:
      - 'Dockerfile'
      - '.github/workflows/build.yml'
  workflow_dispatch:
  schedule:
    # Montags 04:00 UTC – holt Sicherheitsupdates aus dem Basisimage
    - cron: '0 4 * * 1'

env:
  IMAGE_NAME: laravel-ci
  # Diese Version bekommt zusätzlich den :latest-Tag
  LATEST_PHP: '8.5'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
    env:
      # 'true' nur, wenn beide Docker-Hub-Secrets gesetzt sind – sonst wird
      # der Docker-Hub-Teil übersprungen und nur GHCR bespielt.
      HAS_DOCKERHUB: ${{ secrets.DOCKER_USERNAME != '' && secrets.DOCKER_KEY != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        if: env.HAS_DOCKERHUB == 'true'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_KEY }}

      - name: Compute tags
        id: tags
        env:
          DOCKER_USER: ${{ secrets.DOCKER_USERNAME }}
        run: |
          GHCR="ghcr.io/${{ github.repository_owner }}/${IMAGE_NAME}"
          TAGS="${GHCR}:php-${{ matrix.php }}"
          if [ "${{ matrix.php }}" = "${LATEST_PHP}" ]; then
            TAGS="${TAGS},${GHCR}:latest"
          fi
          if [ "${HAS_DOCKERHUB}" = "true" ]; then
            HUB="${DOCKER_USER}/${IMAGE_NAME}"
            TAGS="${TAGS},${HUB}:php-${{ matrix.php }}"
            if [ "${{ matrix.php }}" = "${LATEST_PHP}" ]; then
              TAGS="${TAGS},${HUB}:latest"
            fi
          fi
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"
          echo "Tags für PHP ${{ matrix.php }}: ${TAGS}"

      - name: Build & push (PHP ${{ matrix.php }})
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          build-args: |
            PHP_VERSION=${{ matrix.php }}
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha,scope=php-${{ matrix.php }}
          cache-to: type=gha,mode=max,scope=php-${{ matrix.php }}

      # Belegt, dass das Image liefert, was die CI-Jobs brauchen. Ohne diesen Schritt
      # sind Fehler unsichtbar: `pcov.enabled=0` stand hier lange ohne installiertes
      # pcov im Dockerfile — eine INI-Zeile ins Leere, und ein Test-Impact-Lauf hat
      # daraufhin still einen leeren Abhaengigkeitsgraphen aufgezeichnet.
      #
      # pcov und xdebug muessen VORHANDEN, aber AUS sein; ein Job schaltet sie selbst
      # ein. Alles andere muss geladen sein.
      - name: Verify the image (PHP ${{ matrix.php }})
        run: |
          # Die Tags sind KOMMA-separiert (siehe "Compute tags": :php-X plus
          # optional :latest und die Docker-Hub-Varianten). `head -n1` liefert
          # deshalb die ganze Liste, und `docker run` bricht mit
          # "invalid reference format" (Exit 125) ab.
          IMAGE="$(echo '${{ steps.tags.outputs.tags }}' | cut -d, -f1)"
          echo "Pruefe ${IMAGE}"

          run() { docker run --rm "${IMAGE}" "$@"; }

          run php -v
          run composer --version
          run node -v

          run php -r 'exit(PHP_MAJOR_VERSION . "." . PHP_MINOR_VERSION === "${{ matrix.php }}" ? 0 : 1);' \
            || { echo "::error::PHP-Version im Image ist nicht ${{ matrix.php }}"; exit 1; }

          for ext in bcmath gd intl exif sqlite3 imagick redis pdo_mysql zip pcntl posix; do
            run php -r "exit(extension_loaded('${ext}') ? 0 : 1);" \
              || { echo "::error::Extension ${ext} fehlt im Image"; exit 1; }
          done

          # pcov muss GELADEN, aber ABGESCHALTET sein. Das ist kein Widerspruch:
          # PHPUnit akzeptiert pcov erst bei pcov.enabled === '1' (siehe
          # sebastian/environment Runtime::hasPCOV()), die Extension darf also
          # geladen sein, ohne dass Tests Coverage-Kosten zahlen.
          run php -r 'exit(extension_loaded("pcov") ? 0 : 1);' \
            || { echo "::error::pcov ist nicht installiert — die INI-Zeile pcov.enabled waere ein No-Op"; exit 1; }
          run php -r 'exit(ini_get("pcov.enabled") === "1" ? 1 : 0);' \
            || { echo "::error::pcov ist eingeschaltet — es muss per 99-disable-pcov.ini aus sein"; exit 1; }

          # xdebug dagegen ist im Image installiert, aber sein conf.d-Link ist
          # entfernt, es darf also gar nicht geladen sein.
          run php -r 'exit(extension_loaded("xdebug") ? 1 : 0);' \
            || { echo "::error::xdebug ist geladen — der conf.d-Link muss entfernt bleiben"; exit 1; }

          run sh -c 'printf "pcov.enabled=1\n" > /etc/php/${{ matrix.php }}/cli/conf.d/99-disable-pcov.ini && php -r "exit(ini_get(\"pcov.enabled\") === \"1\" ? 0 : 1);"' \
            || { echo "::error::pcov laesst sich nicht ueber die INI einschalten"; exit 1; }

          run which zstd || { echo "::error::zstd fehlt (actions/cache faellt sonst auf gzip zurueck)"; exit 1; }

          # Die Workflows setzen diese Werkzeuge voraus: git fuer actions/checkout
          # (und damit fuer den aus dem Remote abgeleiteten TIA-Pfad), node/npm fuer
          # `npm ci && npm run build`, composer fuer die Installation.
          for tool in git node npm composer; do
            run which "${tool}" \
              || { echo "::error::${tool} fehlt im Image"; exit 1; }
          done

          # Headless Chrome muss STARTEN, nicht bloss installiert sein: der Ausfall
          # in den Screenshot-Tests war eine fehlende Bibliothek, kein fehlendes
          # Binary ("error while loading shared libraries: libnspr4.so", Code 127).
          # Ein `which google-chrome` haette das nicht bemerkt.
          run google-chrome --version \
            || { echo "::error::google-chrome fehlt im Image"; exit 1; }
          run sh -c 'google-chrome --headless --no-sandbox --disable-gpu --dump-dom about:blank > /dev/null 2>&1' \
            || { echo "::error::headless Chrome startet nicht — Browsershot/puppeteer scheitert dann mit Code 127"; exit 1; }

          # Der Wrapper ist das, was die Jobs per PUPPETEER_EXECUTABLE_PATH benutzen.
          # Er muss OHNE zusaetzliche Flags als root starten — genau das kann Chrome
          # selbst nicht, und zwar auch nicht mit --cap-add=SYS_ADMIN.
          run sh -c '/usr/local/bin/chrome-ci --headless --dump-dom about:blank > /dev/null 2>&1' \
            || { echo "::error::chrome-ci startet als root nicht — Browsershot scheitert dann mit TargetCloseError"; exit 1; }
